<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fishy Fortune Teller</title>

    <!-- Load video game styled font -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <!-- Link external CSS file -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>🐟 Fishy Fortune Teller 🐟</h1>
    <div id="bubble-container">
        <img id="speech-bubble" src="{{ url_for('static', filename='speech_bubble.png') }}" alt="Speech Bubble">
        <p id="fortune-text">{{ fortune }}</p>
    </div>
    <br>
    <button onclick="window.location.reload();">Get New Fortune</button>
</body>
</html>
